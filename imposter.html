:root{--bg:#ffffff;--surface:#ffffff;--surface-2:#f5f5f5;--text:#111111;--muted:#666666;--border:#111111;--red:#E53935;--yellow:#FFD54F;--green:#66BB6A;--blue:#42A5F5;--purple:#AB7BFF;--shadow:5px 5px 0 #111111;}
html[data-theme="dark"]{--bg:#171717;--surface:#222222;--surface-2:#2d2d2d;--text:#ffffff;--muted:#bdbdbd;--border:#ffffff;--shadow:5px 5px 0 #000000;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);}
body{font-family:"Patrick Hand",cursive;overflow-x:hidden;transition:background .2s,color .2s;}
button,input{font-family:inherit;}button{touch-action:manipulation;}
#app{width:100%;min-height:100vh;padding:18px;}
.masthead{width:min(720px,100%);margin:0 auto 22px;display:flex;justify-content:space-between;align-items:center;border:0;padding:0;}
.masthead>div:first-child{min-width:0;}
.masthead .title{font-family:"Patrick Hand SC",cursive;font-size:25px;letter-spacing:.5px;color:var(--text);font-weight:400;}
.masthead .sub{font-size:17px;line-height:1.15;color:var(--muted);margin-top:2px;}
.theme-toggle{width:45px;height:45px;padding:9px;border:3px solid var(--border);border-radius:0;background:var(--surface);color:var(--text);box-shadow:3px 3px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;}
.theme-toggle:active{transform:translate(3px,3px);box-shadow:none;}
.phase-track{width:min(720px,100%);margin:0 auto 18px;display:flex;gap:6px;}
.phase-dot{flex:1;height:5px;border-radius:0;background:var(--border);}
.phase-dot.active{background:var(--yellow);}.phase-dot.done{background:var(--muted);}
.card{width:min(720px,100%);margin:0 auto 20px;background:var(--surface);border:3px solid var(--border);border-radius:0;box-shadow:var(--shadow);padding:22px;color:var(--text);}
.card h2,.card h3{font-family:"Patrick Hand SC",cursive;font-weight:400;margin:0 0 8px;}
.card h2{font-size:35px;line-height:.95;}.card h3{font-size:29px;}
p{font-size:21px;line-height:1.2;margin:7px 0;color:var(--text);}
.muted{color:var(--muted);font-size:18px;}
.row{display:flex;gap:10px;margin-top:18px;}
input[type="text"]{min-width:0;flex:1;height:52px;border:3px solid var(--border);border-radius:0;background:var(--surface);color:var(--text);padding:7px 13px;font-size:23px;outline:none;box-shadow:4px 4px 0 var(--border);}
input[type="text"]::placeholder{color:var(--muted);}
input[type="text"]:focus{outline:none;}
.btn{min-height:52px;border:3px solid var(--border);border-radius:0;background:var(--surface);color:var(--text);padding:9px 17px;font-family:"Patrick Hand SC",cursive;font-size:22px;font-weight:400;line-height:1;box-shadow:4px 4px 0 var(--border);display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:none;}
.btn:active{transform:translate(4px,4px);box-shadow:none;}
.btn-primary{background:var(--yellow);color:#111;width:100%;}.btn-primary:disabled{opacity:.45;pointer-events:none;}
.btn-ghost{background:var(--surface);color:var(--text);}.btn-danger{background:var(--red);color:#111;}.btn-block{width:100%;margin-top:12px;}
.player-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
.player-list li{min-height:51px;border:3px solid #111;background:var(--surface);color:#111;box-shadow:3px 3px 0 #111;border-radius:0;padding:7px 10px 7px 14px;display:flex;align-items:center;justify-content:space-between;font-family:"Patrick Hand SC",cursive;font-size:25px;font-weight:400;}
.player-list li.player-color-0{background:#FFD54F}.player-list li.player-color-1{background:#42A5F5}.player-list li.player-color-2{background:#AB7BFF}.player-list li.player-color-3{background:#66BB6A}.player-list li.player-color-4{background:#E53935}.player-list li.player-color-5{background:#62D6D0}.player-list li.player-color-6{background:#FFD54F}.player-list li.player-color-7{background:#8FA8FF}.player-list li.player-color-8{background:#B7DE5A}.player-list li.player-color-9{background:#FF9B7A}.player-list li.player-color-10{background:#75CFF0}.player-list li.player-color-11{background:#C18CFF}.player-list li.player-color-12{background:#7FD9A6}.player-list li.player-color-13{background:#FFC56E}.player-list li.player-color-14{background:#7EA7FF}.player-list li.player-color-15{background:#D9C7A5}
.player-list li .muted{font-size:16px;color:#333;}.player-list button{width:34px;height:34px;padding:0;border:3px solid #111;background:var(--red);color:#111;border-radius:0;font-size:24px;line-height:1;}
.center{width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100vh - 150px);}
.pass-note{font-size:19px;color:var(--muted);margin-bottom:14px;}
.dossier{width:100%;max-width:320px;aspect-ratio:3/4;margin:0 auto 18px;perspective:1200px;cursor:pointer;}
.dossier-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}
.dossier.open .dossier-inner{transform:rotateY(180deg);}
.dossier-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px 20px;border:3px solid #111;box-shadow:var(--shadow);}
.dossier-front{background:var(--yellow);color:#111;}.dossier-front .stamp{font-family:"Patrick Hand SC",cursive;font-size:16px;letter-spacing:.5px;font-weight:400;color:#111;border:3px solid #111;border-radius:0;padding:5px 12px;margin-bottom:14px;background:#fff;}
.dossier-front .name{font-family:"Patrick Hand SC",cursive;font-size:clamp(40px,11vw,62px);font-weight:400;color:#111;text-align:center;line-height:.95;}.dossier-front .hint{font-size:21px;color:#111;margin-top:10px;}
.dossier-back{background:#fff;color:#111;transform:rotateY(180deg);}.dossier-back.imposter{background:var(--red);color:#111;}.dossier-back.imposter *{color:#111!important;}
.player-card-0 .dossier-front,.player-card-0 .dossier-back:not(.imposter){background:#FFD54F}.player-card-1 .dossier-front,.player-card-1 .dossier-back:not(.imposter){background:#42A5F5}.player-card-2 .dossier-front,.player-card-2 .dossier-back:not(.imposter){background:#AB7BFF}.player-card-3 .dossier-front,.player-card-3 .dossier-back:not(.imposter){background:#66BB6A}.player-card-4 .dossier-front,.player-card-4 .dossier-back:not(.imposter){background:#FFD54F}.player-card-5 .dossier-front,.player-card-5 .dossier-back:not(.imposter){background:#62D6D0}.player-card-6 .dossier-front,.player-card-6 .dossier-back:not(.imposter){background:#FFD54F}.player-card-7 .dossier-front,.player-card-7 .dossier-back:not(.imposter){background:#8FA8FF}.player-card-8 .dossier-front,.player-card-8 .dossier-back:not(.imposter){background:#B7DE5A}.player-card-9 .dossier-front,.player-card-9 .dossier-back:not(.imposter){background:#FF9B7A}.player-card-10 .dossier-front,.player-card-10 .dossier-back:not(.imposter){background:#75CFF0}.player-card-11 .dossier-front,.player-card-11 .dossier-back:not(.imposter){background:#C18CFF}.player-card-12 .dossier-front,.player-card-12 .dossier-back:not(.imposter){background:#7FD9A6}.player-card-13 .dossier-front,.player-card-13 .dossier-back:not(.imposter){background:#FFC56E}.player-card-14 .dossier-front,.player-card-14 .dossier-back:not(.imposter){background:#7EA7FF}.player-card-15 .dossier-front,.player-card-15 .dossier-back:not(.imposter){background:#D9C7A5}
.cat-label{font-family:"Patrick Hand SC",cursive;font-size:16px;letter-spacing:.5px;color:#111;margin-bottom:8px;}.word{font-family:"Patrick Hand SC",cursive;font-size:40px;text-align:center;line-height:1.05;color:#111;}.imposter-word{font-family:"Patrick Hand SC",cursive;font-size:34px;font-weight:400;color:#111;text-align:center;line-height:1.05;}
.vote-grid{width:min(720px,100%);display:flex;flex-direction:column;gap:11px;margin:17px auto;}.vote-opt{width:100%;min-height:57px;padding:9px 15px;border-radius:0;border:3px solid #111;background:var(--surface);box-shadow:4px 4px 0 #111;text-align:left;font-size:26px;cursor:pointer;color:#111;font-family:"Patrick Hand SC",cursive;font-weight:400;}.vote-opt:active{transform:translate(4px,4px);box-shadow:none;}
.vote-opt.player-color-0{background:#FFD54F}.vote-opt.player-color-1{background:#42A5F5}.vote-opt.player-color-2{background:#AB7BFF}.vote-opt.player-color-3{background:#66BB6A}.vote-opt.player-color-4{background:#E53935}.vote-opt.player-color-5{background:#62D6D0}.vote-opt.player-color-6{background:#FFD54F}.vote-opt.player-color-7{background:#8FA8FF}.vote-opt.player-color-8{background:#B7DE5A}.vote-opt.player-color-9{background:#FF9B7A}.vote-opt.player-color-10{background:#75CFF0}.vote-opt.player-color-11{background:#C18CFF}.vote-opt.player-color-12{background:#7FD9A6}.vote-opt.player-color-13{background:#FFC56E}.vote-opt.player-color-14{background:#7EA7FF}.vote-opt.player-color-15{background:#D9C7A5}
.result-banner{width:100%;padding:27px 20px;border:3px solid #111;border-radius:0;box-shadow:var(--shadow);margin-bottom:20px;font-family:"Patrick Hand SC",cursive;font-size:30px;text-align:center;font-weight:400;}.result-banner.caught{background:var(--green);color:#111}.result-banner.escaped{background:var(--red);color:#111}
table.scores{width:100%;border-collapse:collapse;margin-top:10px;}table.scores td{padding:10px 4px;border-bottom:3px solid var(--border);font-size:22px;color:var(--text);}table.scores td:last-child{text-align:right;font-family:"Patrick Hand SC",cursive;font-weight:400;font-size:28px;}.footer-note{width:min(720px,100%);margin:18px auto 0;font-size:17px;color:var(--muted);text-align:center;}.danger-zone{margin-top:35px;padding-top:20px;border-top:2px dashed var(--muted);}
@media(max-width:480px){#app{padding:13px}.masthead{margin-bottom:18px}.masthead .title{font-size:23px}.masthead .sub{font-size:16px}.card{padding:18px}.row{flex-direction:column}.row .btn{width:100%!important}.center{min-height:calc(100vh - 135px)}.dossier{max-width:300px}.vote-grid{margin-top:16px}.result-banner{padding:24px 16px}.btn-block{margin-top:12px}}
@media(prefers-reduced-motion:reduce){.dossier-inner{transition:none}}

.title {
    font-family: "Patrick Hand SC", cursive;
    font-size: clamp(48px, 13vw, 78px);
    line-height: .85;
    text-align: center;
    margin: 8px 0 12px;
    letter-spacing: .5px;
}

.subtitle {
    text-align: center;
    font-size: 22px;
    line-height: 1.15;
    color: var(--muted);
    margin: 0 0 25px;
}

.eyebrow {
    display: table;
    margin: 0 auto 12px;
    padding: 5px 12px;
    background: var(--text);
    color: var(--bg);
    border: 3px solid var(--border);
    font-family: "Patrick Hand SC", cursive;
    font-size: 16px;
    letter-spacing: .5px;
}
    
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  var CATEGORIES = {
    "Fruits": ["Mango","Banana","Pineapple","Watermelon","Papaya","Guava","Lychee","Jackfruit","Coconut","Pomegranate","Orange","Grapes","Apple","Strawberry","Kiwi","Dragon Fruit"],
    "Animals": ["Elephant","Tiger","Peacock","Crocodile","Dolphin","Owl","Kangaroo","Penguin","Camel","Fox","Octopus","Parrot","Rhino","Cheetah","Bat","Turtle"],
    "Bangladeshi Foods": ["Biryani","Hilsa Fish","Panta Bhat","Fuchka","Chotpoti","Roshogolla","Mishti Doi","Khichuri","Bhorta","Shingara","Jhalmuri","Pitha","Kacchi","Haleem","Luchi","Doi Fuchka"],
    "Movie": ["Titanic","Avengers","Jurassic Park","Inception","Avatar","Frozen","The Lion King","Jaws","La La Land","Interstellar","The Godfather","Parasite","Toy Story","Gladiator","Mission: Impossible","3 Idiots"],
    "TV Show": ["Friends","The Office","Stranger Things","Sherlock","Breaking Bad","Game of Thrones","Money Heist","Squid Game","The Crown","Peaky Blinders","Rick and Morty","The Simpsons","Ertugrul","Family Guy","Grey's Anatomy","The Mandalorian"],
    "Sports": ["Cricket","Football","Badminton","Kabaddi","Chess","Swimming","Table Tennis","Volleyball","Carrom","Boxing","Basketball","Archery","Wrestling","Athletics","Hockey","Cycling"],
    "Superheroes & Villains": ["Batman","Spider-Man","Iron Man","Thanos","Joker","Superman","Wonder Woman","Hulk","Loki","Thor","Black Panther","Venom","Deadpool","Wolverine","Doctor Strange","Captain America"],
    "Campus Life": ["Final Exam","Group Project","Wi-Fi Password","Cafeteria","Attendance","Semester Break","Thesis Defense","Lab Report","Scholarship","Late Submission","Presentation","Study Group","Registration","Internship","Viva","Roll Call"],
    "Professions": ["Doctor","Engineer","Teacher","Pilot","Chef","Police Officer","Lawyer","Farmer","Photographer","Journalist","Architect","Firefighter","Tailor","Electrician","Scientist","Barber"],
    "Household Items": ["Refrigerator","Pressure Cooker","Ceiling Fan","Umbrella","Mosquito Net","Almirah","Thermos","Sewing Machine","Alarm Clock","Broom","Mirror","Blanket","Candle","Ladder","Bucket","Charger"],
    "Countries": ["Bangladesh","India","Japan","Brazil","Egypt","Canada","France","Turkey","Thailand","Nepal","Australia","Germany","Kenya","Mexico","Indonesia","Italy"],
    "Gadgets & Tech": ["Smartphone","Laptop","Power Bank","Headphones","Smartwatch","Router","Webcam","Drone","USB Drive","Printer","Speaker","VR Headset","Keyboard","Tablet","Camera","Microphone"],
    "Festivals & Celebrations": ["Eid","Pohela Boishakh","Durga Puja","Christmas","Victory Day","Wedding","Birthday Party","New Year","Valentine's Day","Independence Day","Graduation","Ramadan","Diwali","Concert","Reunion","Farewell"],
    "Celebrity": ["Shakib Al Hasan","Cristiano Ronaldo","Lionel Messi","Shah Rukh Khan","Priyanka Chopra","Taylor Swift","Elon Musk","Virat Kohli","A.R. Rahman","Dwayne Johnson","Zendaya","Chanchal Chowdhury","Ariana Grande","Tom Cruise","Rihanna","Sachin Tendulkar"],
    "Book": ["Harry Potter","The Alchemist","1984","To Kill a Mockingbird","The Hobbit","Pride and Prejudice","The Kite Runner","The Hunger Games","Percy Jackson","The Da Vinci Code","Feluda","Himu","The Diary of a Young Girl","Charlie and the Chocolate Factory","A Game of Thrones","The Little Prince"],
    "Transportation": ["Rickshaw","CNG Auto-rickshaw","Launch (River Boat)","Bicycle","Motorbike","Bus","Train","Airplane","Ship","Helicopter","Tempo","Car","Ferry","Cable Car","Submarine","Hot Air Balloon"],
    "Fictional Character": ["Sherlock Holmes","Hermione Granger","Jack Sparrow","Frodo Baggins","Elsa","Mowgli","Alice in Wonderland","Shrek","Simba","Aladdin","Mickey Mouse","Doraemon","Gopal Bhar","Sinbad","Pinocchio","Tom and Jerry"]
  };
  var CAT_NAMES = Object.keys(CATEGORIES);

  var app = document.getElementById("app");

  var state = {
    players: [],
    scores: [],
    usedWords: {},
    lastImposter: -1,
    round: 0,
    phase: "setup",
    revealIdx: 0,
    hasViewed: false,
    cardOpen: false,
    category: "", word: "", imposterIdx: -1,
    voteIdx: 0, votes: [],
    accusedIdx: -1, caught: false, guessInput: "", guessResult: null
  };

  function save(){
    try{
      localStorage.setItem("imposterGame_v1", JSON.stringify({players:state.players, scores:state.scores}));
    }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem("imposterGame_v1");
      if(raw){
        var data = JSON.parse(raw);
        if(data.players && data.players.length){
          state.players = data.players;
          state.scores = data.scores && data.scores.length === data.players.length ? data.scores : data.players.map(function(){return 0;});
        }
      }
    }catch(e){}
  }
  load();

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function pickWord(){
    var cat = CAT_NAMES[Math.floor(Math.random()*CAT_NAMES.length)];
    var words = CATEGORIES[cat];
    if(!state.usedWords[cat]) state.usedWords[cat] = [];
    var used = state.usedWords[cat];
    var available = words.filter(function(w){return used.indexOf(w) === -1;});
    if(available.length === 0){ state.usedWords[cat] = []; available = words.slice(); }
    var word = available[Math.floor(Math.random()*available.length)];
    state.usedWords[cat].push(word);
    return {cat:cat, word:word};
  }

  function pickImposter(){
    if(state.players.length <= 1) return 0;
    var idx, tries=0;
    do{
      idx = Math.floor(Math.random()*state.players.length);
      tries++;
    } while(idx === state.lastImposter && tries < 6 && state.players.length > 2);
    return idx;
  }

  function startRound(){
    var picked = pickWord();
    state.category = picked.cat;
    state.word = picked.word;
    state.imposterIdx = pickImposter();
    state.lastImposter = state.imposterIdx;
    state.round += 1;
    state.revealIdx = 0;
    state.hasViewed = false;
    state.cardOpen = false;
    state.phase = "reveal";
    state.voteIdx = 0;
    state.votes = [];
    state.accusedIdx = -1;
    state.guessInput = "";
    state.guessResult = null;
    render();
  }

  function nextReveal(){
    state.cardOpen = false;
    state.hasViewed = false;
    if(state.revealIdx < state.players.length - 1){
      state.revealIdx += 1;
      render();
    } else {
      state.phase = "discuss";
      render();
    }
  }

  function goVote(){
    state.phase = "vote";
    state.voteIdx = 0;
    state.votes = [];
    render();
  }

  function castVote(accusedPlayerIdx){
    state.votes.push(accusedPlayerIdx);
    if(state.voteIdx < state.players.length - 1){
      state.voteIdx += 1;
      render();
    } else {
      tallyVotes();
    }
  }

  function tallyVotes(){
    var tally = {};
    state.votes.forEach(function(v){ tally[v] = (tally[v]||0) + 1; });
    var best = -1, bestCount = -1, tie = false;
    Object.keys(tally).forEach(function(k){
      var c = tally[k];
      if(c > bestCount){ bestCount = c; best = parseInt(k,10); tie = false; }
      else if(c === bestCount){ tie = true; }
    });
    state.accusedIdx = tie ? -1 : best;
    state.caught = state.accusedIdx === state.imposterIdx;
    if(state.caught){
      state.scores = state.scores.map(function(s,i){ return i === state.imposterIdx ? s : s + 1; });
    } else {
      state.scores[state.imposterIdx] += 2;
    }
    save();
    state.phase = "results";
    render();
  }

  function addPlayer(name){
    name = (name||"").trim();
    if(!name) return;
    state.players.push(name);
    state.scores.push(0);
    save();
    render();
  }
  function removePlayer(i){
    state.players.splice(i,1);
    state.scores.splice(i,1);
    save();
    render();
  }
  function resetAll(){
    if(!confirm("Clear players and scores?")) return;
    state.players = []; state.scores = [];
    save();
    render();
  }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function phaseTrack(active){
    var steps = ["reveal","discuss","vote","results"];
    var idx = steps.indexOf(active);
    return '<div class="phase-track">' + steps.map(function(s,i){
      var cls = i < idx ? "done" : (i === idx ? "active" : "");
      return '<div class="phase-dot ' + cls + '"></div>';
    }).join("") + '</div>';
  }

  function render(){
    if(state.phase === "setup") return renderSetup();
    if(state.phase === "reveal") return renderReveal();
    if(state.phase === "discuss") return renderDiscuss();
    if(state.phase === "vote") return renderVote();
    if(state.phase === "results") return renderResults();
  }

  function masthead(sub){
    var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "☀" : "☾";
    return '<div class="masthead">' +
      '<div><div class="title">FIND THE IMPOSTER</div><div class="sub">' + esc(sub) + '</div></div>' +
      '<button class="theme-toggle" id="themeBtn" title="Toggle theme">' + theme + '</button>' +
      '</div>';
  }
  
  function renderSetup(){
    app.innerHTML =
      masthead(state.players.length + " on the case") +
        '<div class="eyebrow">A SECRET WORD GAME</div>'+
    '<h1 class="title">Imposter.<br>Among.<br>Us.</h1>'+
    '<p class="subtitle">Everybody will know the Secret Word.<br>Whoever is Imposter will Lie.</p>' +
      '<div class="card">' +
        '<h2>Recruit players</h2>' +
        '<p class="muted">At least 3 people. Names only — no scores lost between rounds.</p>' +
        '<div class="row" style="margin-bottom:12px;">' +
          '<input type="text" id="nameInput" placeholder="Player name" maxlength="20">' +
          '<button class="btn btn-primary" id="addBtn" style="width:auto;">Add</button>' +
        '</div>' +
        '<ul class="player-list">' +
          state.players.map(function(p,i){
            return '<li class="player-color-' + (i % 16) + '"><span>' + esc(p) + (state.scores[i] ? ' <span class="muted">· ' + state.scores[i] + ' pts</span>' : '') + '</span>' +
              '<button data-remove="' + i + '">×</button></li>';
          }).join("") +
        '</ul>' +
        (state.players.length ? '<button class="btn btn-ghost btn-block" id="resetAllBtn">Clear players &amp; scores</button>' : '') +
      '</div>' +
      '<button class="btn btn-primary btn-block" id="startBtn" ' +
        (state.players.length < 3 ? 'disabled' : '') + '>Open the case — start</button>' +
      '<div class="footer-note">Every category is in the mix, every round — you won\'t know what\'s coming.</div>';

    document.getElementById("addBtn").onclick = function(){
      var el = document.getElementById("nameInput");
      addPlayer(el.value);
      el.value = "";
      el.focus();
    };
    document.getElementById("nameInput").onkeydown = function(e){
      if(e.key === "Enter"){ addPlayer(this.value); this.value=""; }
    };
    app.querySelectorAll("[data-remove]").forEach(function(b){
      b.onclick = function(){ removePlayer(parseInt(this.getAttribute("data-remove"),10)); };
    });
    if(document.getElementById("resetAllBtn")) document.getElementById("resetAllBtn").onclick = resetAll;
    var startBtn = document.getElementById("startBtn");
    if(startBtn) startBtn.onclick = startRound;
    bindTheme();
  }

  function renderReveal(){
    var name = state.players[state.revealIdx];
    var isImposter = state.revealIdx === state.imposterIdx;
    app.innerHTML =
      masthead("Round " + state.round) +
      phaseTrack("reveal") +
      '<div class="center">' +
        '<div class="pass-note">Hand the phone to <strong>' + esc(name) + '</strong>. Everyone else, look away.</div>' +
        '<div class="dossier player-card-' + (state.revealIdx % 16) + ' ' + (state.cardOpen?'open':'') + '" id="dossier">' +
          '<div class="dossier-inner">' +
            '<div class="dossier-face dossier-front">' +
              '<div class="stamp">Classified</div>' +
              '<div class="name">' + esc(name) + '</div>' +
              '<div class="hint">Tap to reveal your card</div>' +
            '</div>' +
            '<div class="dossier-face dossier-back ' + (isImposter?'imposter':'') + '">' +
              (isImposter ?
                '<div class="cat-label">CATEGORY</div><div class="imposter-word">' + esc(state.category) + '</div>' +
                '<p style="margin-top:14px;font-weight:700;color:var(--danger);">You are the Imposter</p>' +
                '<p class="muted" style="font-size:13px;">You don\'t know the word. Listen closely and bluff.</p>'
                :
                '<div class="cat-label">CATEGORY: ' + esc(state.category).toUpperCase() + '</div><div class="word">' + esc(state.word) + '</div>' +
                '<p class="muted" style="font-size:13px;margin-top:10px;">Remember it. Never say it out loud.</p>'
              ) +
            '</div>' +
          '</div>' +
        '</div>' +
        (state.cardOpen ?
          '<button class="btn btn-primary btn-block" id="hideBtn">Got it — hide card</button>' :
          '') +
        (state.hasViewed && !state.cardOpen ?
          '<button class="btn btn-primary btn-block" id="passBtn">Pass to next player</button>' :
          (!state.cardOpen ? '<div class="muted" style="margin-top:10px;">' + (state.revealIdx+1) + ' of ' + state.players.length + '</div>' : '')
        ) +
      '</div>';

    var dossier = document.getElementById("dossier");
    dossier.onclick = function(){
      if(!state.cardOpen){
        state.cardOpen = true;
        state.hasViewed = true;
        render();
      }
    };
    if(document.getElementById("hideBtn")) document.getElementById("hideBtn").onclick = function(){
      state.cardOpen = false;
      render();
    };
    if(document.getElementById("passBtn")) document.getElementById("passBtn").onclick = nextReveal;
  }

  function renderDiscuss(){
    app.innerHTML =
      masthead("Round " + state.round) +
      phaseTrack("discuss") +
      '<div class="center">' +
        '<h2>Discuss</h2>' +
        '<p class="muted">Everyone says one word or phrase about the secret word — never the word itself. Go around the circle, then call it whenever you\'re ready.</p>' +
        '<button class="btn btn-primary btn-block" id="voteBtn">Move to voting</button>' +
      '</div>';
    document.getElementById("voteBtn").onclick = goVote;
  }

  function renderVote(){
    var voter = state.players[state.voteIdx];
    app.innerHTML =
      masthead("Round " + state.round) +
      phaseTrack("vote") +
      '<div class="center">' +
        '<div class="pass-note">Hand the phone to <strong>' + esc(voter) + '</strong> only.</div>' +
        '<h2>Who is the imposter?</h2>' +
        '<div class="vote-grid">' +
          state.players.map(function(p,i){
            if(i === state.voteIdx) return "";
            return '<button class="vote-opt player-color-' + (i % 16) + '" data-vote="' + i + '">' + esc(p) + '</button>';
          }).join("") +
        '</div>' +
        '<div class="muted">Vote ' + (state.voteIdx+1) + ' of ' + state.players.length + '</div>' +
      '</div>';
    app.querySelectorAll("[data-vote]").forEach(function(b){
      b.onclick = function(){ castVote(parseInt(this.getAttribute("data-vote"),10)); };
    });
  }

  function renderResults(){
    var imposterName = state.players[state.imposterIdx];
    var accusedName = state.accusedIdx >= 0 ? state.players[state.accusedIdx] : null;
    app.innerHTML =
      masthead("Round " + state.round + " — results") +
      phaseTrack("results") +
      '<div class="card">' +
        (state.accusedIdx === -1 ?
          '<div class="result-banner escaped">Vote tied — no one accused. The imposter escapes.</div>' :
          '<div class="result-banner ' + (state.caught?'caught':'escaped') + '">' +
            esc(accusedName) + ' was accused — ' + (state.caught ? 'correct, that was the imposter.' : 'wrong, the imposter got away.') +
          '</div>'
        ) +
        '<p><strong>Secret word:</strong> ' + esc(state.word) + ' <span class="muted">(' + esc(state.category) + ')</span></p>' +
        '<p><strong>Imposter:</strong> ' + esc(imposterName) + '</p>' +

      '</div>' +
      '<div class="card" style="margin-top:14px;">' +
        '<h3>Scoreboard</h3>' +
        '<table class="scores">' +
          state.players.map(function(p,i){return {name:p, score:state.scores[i]};})
            .sort(function(a,b){return b.score - a.score;})
            .map(function(r){ return '<tr><td>' + esc(r.name) + '</td><td>' + r.score + '</td></tr>'; }).join("") +
        '</table>' +
      '</div>' +
      '<button class="btn btn-primary btn-block" id="nextRoundBtn">Next round</button>' +
      '<button class="btn btn-ghost btn-block" id="editPlayersBtn">Edit players</button>';

    document.getElementById("nextRoundBtn").onclick = startRound;
    document.getElementById("editPlayersBtn").onclick = function(){ state.phase = "setup"; render(); };
  }

  function bindTheme(){
    var btn = document.getElementById("themeBtn");
    if(!btn) return;
    btn.onclick = function(){
      var cur = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
      render();
    };
  }

  render();
})();
</script>
</body>
</html>
